name: 🐞 问题反馈
description: 播报不对、悬浮窗异常、采集不到数据……先说清楚这三件事
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈！带上这几条能省一轮来回：**哪一局、什么游戏模式、你期待它说什么**。
        诊断包请在设置页 →「维护与诊断」→ 标记问题时间 → 导出诊断记录（已脱敏，不含聊天正文、玩家名、凭据、截图）。
  - type: input
    id: version
    attributes:
      label: 金宝版本
      description: 设置页底部，或悬浮窗右键菜单里能看到
      placeholder: "0.2.17-standalone-preview.1"
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: 哪个游戏
      options:
        - 英雄联盟 · 海克斯大乱斗
        - 英雄联盟 · 其他模式
        - 王者荣耀
        - 其他游戏（窗口观察 / 日志接入）
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你看到的原文（截图更佳），以及你期待它说什么
      placeholder: |
        它说：「先补个防装」
        我希望它说：「先买负极斗篷，对面两个法伤」
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 开局选 X 英雄
        2. 第 3 分钟拿到「钢化你心」
        3. 阵亡后播报没提心之钢
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断包 / 日志
      description: 可直接把导出的 zip 拖进这里，或贴 `logs/speech.jsonl`、`logs/coach_broadcasts.jsonl` 的相关几行
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 我确认上传的内容不含账号密码或其他敏感信息
          required: true
