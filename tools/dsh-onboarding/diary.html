<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金宝日记</title><style>
/* ── 物理层：纸色、墨色、赭石、发丝线。颜色锁定在这里，其余只用变量。 ── */
:root{
  color-scheme:light;
  --paper:#f7f4ec; --paper-lift:#fffdf7; --paper-card:#fffdf9;
  --ink:#2b2a26; --ink-soft:#6f6a5e; --ink-faint:#9a9384;
  --line:rgba(122,102,72,.16); --line-strong:rgba(122,102,72,.28);
  --ochre:#a9762f; --ochre-soft:rgba(169,118,47,.10);
  --brick:#a9563c; --brick-soft:rgba(169,86,60,.10);
  --radius:18px; --radius-sm:12px;
  --shadow-rest:0 1px 0 rgba(122,102,72,.06);
  --ease:cubic-bezier(.22,.61,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Songti SC","STSong","SimSun",Georgia,serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;font-family:var(--font);color:var(--ink);
  background:radial-gradient(120% 80% at 50% -10%, #fffdf6 0%, var(--paper) 46%, #f2eee3 100%);
  background-attachment:fixed;
  line-height:1.65;letter-spacing:.005em;
}
/* 暗角：一层不参与布局的薄膜，让纯色背景不死板 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(115% 85% at 50% 0%, transparent 42%, rgba(86,70,45,.07) 100%);
}
main{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:32px 28px 64px}

/* ── 顶部题头 ── */
.masthead{
  display:flex;align-items:flex-start;justify-content:space-between;gap:24px;
  padding:6px 2px 20px;border-bottom:1px solid var(--line)
}
.eyebrow{display:inline-block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ochre);font-weight:600}
h1{
  margin:8px 0 8px;font-family:var(--serif);font-size:clamp(30px,3.6vw,40px);
  font-weight:600;letter-spacing:.02em;line-height:1.2
}
.count{margin:0;font-size:13.5px;color:var(--ink-faint)}
.count b{font-weight:600;color:var(--ochre);font-variant-numeric:tabular-nums}
.masthead-side{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:24px}

.back{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:13.5px;text-decoration:none}
.back:hover{color:var(--ochre);text-decoration:underline;text-underline-offset:3px}
.back:focus-visible{outline:2px solid rgba(169,118,47,.55);outline-offset:3px;border-radius:6px}

/* ── 日记开关 ── */
.switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap
}
.switch-track{
  position:relative;display:block;width:37px;height:21px;border-radius:999px;
  background:rgba(122,102,72,.14);border:1px solid var(--line-strong);
  transition:background .18s var(--ease),border-color .18s var(--ease)
}
.switch-track::after{
  content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:var(--paper-lift);box-shadow:0 1px 3px rgba(73,58,36,.26);
  transition:transform .18s var(--ease)
}
.switch input:checked + .switch-track{background:var(--ochre);border-color:rgba(169,118,47,.62)}
.switch input:checked + .switch-track::after{transform:translateX(16px)}
.switch input:focus-visible + .switch-track{outline:2px solid rgba(169,118,47,.55);outline-offset:2px}
.switch input:disabled + .switch-track{opacity:.5;cursor:wait}
.switch-text{font-size:13px;color:var(--ink-soft)}

#diaryStatus{min-height:19px;margin:10px 2px 0;font-size:12.5px;color:var(--ink-faint)}
#diaryStatus[data-tone="error"]{color:var(--brick)}

/* ── 两栏：左日期，右正文 ── */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start;margin-top:14px}
.rail{position:sticky;top:24px;min-width:0}
.rail-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  margin:0 0 9px;padding:0 4px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ochre);font-weight:600
}
.rail-head span{font-size:11.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-faint)}
.days{
  list-style:none;margin:0;padding:0 4px 0 0;overflow:auto;
  max-height:calc(100dvh - 210px);scrollbar-width:thin;scrollbar-color:rgba(122,102,72,.22) transparent
}
.days::-webkit-scrollbar{width:6px}
.days::-webkit-scrollbar-thumb{background:rgba(122,102,72,.18);border-radius:999px}
.days li{margin:0}
.day{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;
  width:100%;margin:0 0 2px;padding:7px 10px;border:1px solid transparent;border-radius:10px;
  background:transparent;font:inherit;color:var(--ink-soft);text-align:left;cursor:pointer;
  transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease)
}
.day:disabled{cursor:default}
.day time{min-width:42px;font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.03em;color:inherit}
.day-week{font-size:11.5px;color:var(--ink-faint)}
.day-mood{
  max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:0 7px;border-radius:999px;border:1px solid rgba(169,118,47,.18);
  background:var(--ochre-soft);color:#8a6a2f;font-size:11px;line-height:18px
}
.day-blank{color:#bbb3a4}
.day-blank time{color:inherit}
.day:not(:disabled):hover{background:rgba(255,253,247,.92);border-color:var(--line)}
.day-blank:not(:disabled):hover{color:var(--ink-faint);background:rgba(255,253,247,.6)}
.day:focus-visible{outline:2px solid rgba(169,118,47,.55);outline-offset:1px}
.day[aria-current="true"]{
  background:var(--ochre-soft);border-color:rgba(169,118,47,.24);color:var(--ink);
  box-shadow:inset 2px 0 0 var(--ochre)
}
.day[aria-current="true"] .day-week{color:var(--ink-soft)}
.day[aria-current="true"] .day-mood{background:rgba(255,253,247,.7)}

/* ── 右栏纸张 ── */
.sheet{
  position:relative;min-height:480px;padding:38px 42px 26px;
  border:1px solid var(--line);border-radius:24px;
  background:linear-gradient(180deg,var(--paper-card) 0%,rgba(252,249,241,.82) 100%);
  box-shadow:var(--shadow-rest)
}
.sheet::before{
  content:"";position:absolute;left:42px;right:42px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(169,118,47,.22),transparent)
}
.entry{margin:0}
#diaryTitle{
  margin:0 0 10px;font-family:var(--serif);font-size:clamp(26px,2.6vw,31px);
  font-weight:600;line-height:1.4;letter-spacing:.015em;color:var(--ink)
}
.entry-meta{display:flex;align-items:center;gap:8px;margin:0;font-size:12.5px;color:var(--ink-faint)}
.entry-meta time{font-variant-numeric:tabular-nums}
.entry-meta .dot{color:rgba(122,102,72,.42)}
#diaryMood{color:var(--ochre)}
.entry-text{margin-top:28px;max-width:34em;font-size:16px;line-height:1.9;color:var(--ink-soft)}
.entry-text p{margin:0 0 1.05em;white-space:pre-line;overflow-wrap:break-word}
.entry-text p:last-child{margin-bottom:0}
.entry-line{
  max-width:34em;margin:30px 0 0;padding:2px 0 2px 14px;
  border-left:2px solid rgba(169,118,47,.4);
  font-family:var(--serif);font-size:14.5px;line-height:1.8;color:#7d5c28;white-space:pre-line
}
.entry-foot{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:38px;padding-top:15px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-faint)
}
.entry-foot time{font-variant-numeric:tabular-nums}
#diaryDelete{
  border:0;background:transparent;font:inherit;font-size:12px;color:var(--ink-faint);
  padding:5px 8px;border-radius:8px;cursor:pointer;opacity:.7;
  transition:color .16s var(--ease),background .16s var(--ease),opacity .16s var(--ease)
}
#diaryDelete:hover{color:var(--brick);background:var(--brick-soft);opacity:1}
#diaryDelete:focus-visible{outline:2px solid rgba(169,86,60,.5);outline-offset:1px}
#diaryDelete:disabled{opacity:.35;cursor:wait}

/* ── 空状态 / 失败状态 ── */
.state{
  min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;padding:40px 20px;text-align:center
}
.state-mark{display:block;width:34px;height:1px;margin-bottom:6px;background:rgba(169,118,47,.35)}
.state p{margin:0;font-size:14px;line-height:1.9;color:var(--ink-soft)}
.state .state-sub{font-size:12.5px;color:var(--ink-faint)}
#diaryError p:first-of-type{color:var(--ink)}
.retry{
  margin-top:8px;padding:7px 18px;border:1px solid var(--line-strong);border-radius:10px;
  background:rgba(255,253,247,.9);font:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer;
  transition:border-color .16s var(--ease),background .16s var(--ease),color .16s var(--ease)
}
.retry:hover{border-color:rgba(169,118,47,.5);background:#fff9ec;color:var(--ochre)}
.retry:focus-visible{outline:2px solid rgba(169,118,47,.55);outline-offset:2px}

/* ── 窄屏：上下堆叠 ── */
@media(max-width:820px){
  main{padding:22px 18px 52px}
  .masthead{flex-direction:column;gap:0;padding-bottom:16px}
  .masthead-side{width:100%;justify-content:space-between;padding-top:14px}
  .layout{grid-template-columns:1fr;gap:20px;margin-top:12px}
  .rail{position:static}
  .days{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 6px;
    max-height:232px;padding-right:2px
  }
  .sheet{min-height:0;padding:28px 22px 22px}
  .sheet::before{left:22px;right:22px}
  .entry-text{font-size:15.5px}
  .state{min-height:320px}
}
@media(max-width:460px){
  main{padding:18px 14px 44px}
  .days{grid-template-columns:1fr}
  .masthead-side{gap:12px}
  .sheet{padding:24px 18px 18px}
  .state{min-height:280px;padding:30px 10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><style>
/* 纸张感：一层极轻的纹理 + 右上角折角，只加在正文那张纸上 */
.sheet{position:relative;background-image:repeating-linear-gradient(0deg,rgba(122,102,72,.035) 0 1px,transparent 1px 26px);}
.sheet::after{content:'';position:absolute;top:0;right:0;width:26px;height:26px;background:linear-gradient(225deg,rgba(122,102,72,.16) 0 50%,transparent 50%);pointer-events:none;}
.entry-text del{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--brick);text-decoration-thickness:1px;}
.edited-note{color:var(--ink-faint);font-size:.85em;margin-left:.35em;}
.last-year{display:block;margin:.4rem 0 1rem;padding:.3rem .1rem;background:none;border:0;border-bottom:1px dashed var(--line-strong);color:var(--ochre);font:inherit;font-size:.92em;cursor:pointer;}
.last-year:hover{border-bottom-color:var(--ochre);}
</style></head><body><main>
<header class="masthead">
  <div class="masthead-main">
    <span class="eyebrow">Jinbao · Diary</span>
    <h1>金宝日记</h1>
    <p class="count">和你一起写了 <b id="diaryCount" class="num">0</b> 篇</p>
  </div>
  <div class="masthead-side">
    <label class="switch">
      <input type="checkbox" id="diaryToggle" checked>
      <span class="switch-track" aria-hidden="true"></span>
      <span class="switch-text">日记</span>
    </label>
    <a id="back" class="back" href="/">← 返回设置</a>
  </div>
</header>
<p id="diaryStatus" role="status" aria-live="polite"></p>

<div class="layout">
  <aside class="rail" aria-label="日记日期">
    <p class="rail-head">最近 60 天 <span>从今天往回</span></p>
    <ul id="diaryList" class="days"></ul>
  </aside>

  <section class="sheet" aria-label="日记正文" aria-live="polite">
    <div id="diaryLoading" class="state">
      <span class="state-mark" aria-hidden="true"></span>
      <p>正在翻日记…</p>
    </div>

    <article id="diaryBody" class="entry" hidden>
      <h2 id="diaryTitle"></h2>
      <p id="diaryMeta" class="entry-meta">
        <time id="diaryMetaTime"></time>
        <span id="diaryMetaDot" class="dot" aria-hidden="true">·</span>
        <span id="diaryMood"></span>
      </p>
      <div id="diaryText" class="entry-text"></div>
      <p id="diaryLine" class="entry-line" hidden></p>
      <button id="diaryLastYear" class="last-year" type="button" hidden></button>
      <footer class="entry-foot">
        <span class="byline"><span id="diaryRole">金宝</span> · 写于 <time id="diaryAt">那天</time></span>
        <button id="diaryDelete" type="button">撕掉</button>
      </footer>
    </article>

    <div id="diaryEmpty" class="state" hidden>
      <span class="state-mark" aria-hidden="true"></span>
      <p id="diaryEmptyText">她还没写过。等今天打完，明天再来看看。</p>
      <p class="state-sub" id="diaryEmptySub">写过的页会留在这台电脑里，不会上传。</p>
    </div>

    <div id="diaryError" class="state" hidden>
      <span class="state-mark" aria-hidden="true"></span>
      <p>日记暂时读不出来</p>
      <p class="state-sub">可能只是这会儿没连上，等一会儿再试试。</p>
      <button id="diaryRetry" class="retry" type="button">重试</button>
    </div>
  </section>
</div>
</main><script>
(function(){
'use strict';
const incoming=location.hash.slice(1);let nonce=incoming;
try{if(/^[a-f0-9]{64}$/.test(incoming))sessionStorage.setItem('jinbao-settings-setup',incoming);else nonce=sessionStorage.getItem('jinbao-settings-setup')||'';}catch{}
history.replaceState(null,'',location.pathname);
const $=id=>document.getElementById(id);
$('back').href='/#'+nonce;

const DAYS=60;
const WEEKDAYS=['周日','周一','周二','周三','周四','周五','周六'];
let entries=[],byDay=new Map(),count=0,selected='',ready=false,panelSeq=0;

function pad(value){return String(value).padStart(2,'0')}
function escape(value){
  return String(value==null?'':value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function notice(message,tone){
  const el=$('diaryStatus');
  el.textContent=message||'';
  if(tone)el.dataset.tone=tone;else el.removeAttribute('data-tone');
}
function dayKeyOf(date){return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())}
function parseDay(day){
  const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(day||''));
  if(!match)return null;
  const date=new Date(Number(match[1]),Number(match[2])-1,Number(match[3]),12,0,0,0);
  return Number.isNaN(date.getTime())?null:date;
}
function fmtMonthDay(day){
  const date=parseDay(day);
  return date?pad(date.getMonth()+1)+'-'+pad(date.getDate()):String(day||'').slice(5);
}
function fmtFull(day){
  const date=parseDay(day);
  return date?date.getFullYear()+'年'+(date.getMonth()+1)+'月'+date.getDate()+'日':String(day||'');
}
function fmtWeekday(day){
  const date=parseDay(day);
  return date?WEEKDAYS[date.getDay()]:'';
}
function recentDays(total){
  const days=[],today=new Date();
  today.setHours(12,0,0,0);
  for(let offset=0;offset<total;offset++){
    const date=new Date(today);
    date.setDate(today.getDate()-offset);
    days.push(dayKeyOf(date));
  }
  return days;
}
function toDate(at){
  if(at==null||at==='')return null;
  const value=(typeof at==='number'||/^\d+$/.test(String(at)))?Number(at):String(at);
  const date=new Date(value);
  return Number.isFinite(date.getTime())?date:null;
}
function fmtWhen(at){
  const date=toDate(at);
  if(!date)return '那天';
  return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())+' '+pad(date.getHours())+':'+pad(date.getMinutes());
}

function setCount(value){
  count=Math.max(0,Math.floor(Number(value)||0));
  $('diaryCount').textContent=String(count);
}
function setPanel(state){
  $('diaryLoading').hidden=state!=='loading';
  $('diaryEmpty').hidden=state!=='empty';
  $('diaryError').hidden=state!=='error';
  $('diaryBody').hidden=state!=='entry';
}
function renderList(){
  const list=$('diaryList');
  const fragment=document.createDocumentFragment();
  for(const day of recentDays(DAYS)){
    const entry=byDay.get(day);
    const item=document.createElement('li');
    const button=document.createElement('button');
    button.type='button';
    button.className='day'+(entry?'':' day-blank');
    button.dataset.day=day;
    button.disabled=!ready;
    if(day===selected)button.setAttribute('aria-current','true');
    const time=document.createElement('time');
    time.dateTime=day;
    time.textContent=fmtMonthDay(day);
    button.append(time);
    if(entry){
      const week=document.createElement('span');
      week.className='day-week';
      week.textContent=fmtWeekday(day);
      const mood=document.createElement('span');
      mood.className='day-mood';
      mood.textContent=entry.mood||'';
      button.append(week,mood);
      button.setAttribute('aria-label',fmtMonthDay(day)+' '+fmtWeekday(day)+'，'+(entry.mood||'有日记'));
    }else{
      button.setAttribute('aria-label',fmtMonthDay(day)+'，这天没有日记');
    }
    button.addEventListener('click',()=>{selectDay(day)});
    item.append(button);
    fragment.append(item);
  }
  list.replaceChildren(fragment);
}
function showEmpty(global,day){
  if(day)selected=day;
  setPanel('empty');
  if(global||count===0){
    $('diaryEmptyText').textContent='她还没写过。等今天打完，明天再来看看。';
    $('diaryEmptySub').textContent='写过的页会留在这台电脑里，不会上传。';
  }else{
    $('diaryEmptyText').textContent='这一天，她没有动笔。';
    $('diaryEmptySub').textContent='日子还长，不急。';
  }
}
function showError(){setPanel('error')}

function renderEntry(entry){
  const day=/^\d{4}-\d{2}-\d{2}$/.test(String(entry.day||''))?entry.day:selected;
  setPanel('entry');
  $('diaryTitle').textContent=String(entry.title||'').trim()||'没有标题';
  const metaTime=$('diaryMetaTime');
  if(parseDay(day))metaTime.dateTime=day;else metaTime.removeAttribute('datetime');
  const kindLabel={weekly:'一周回顾',letter:'节日信'}[String(entry.kind||'')]||'';
  metaTime.textContent=(kindLabel?kindLabel+' · ':'')+fmtFull(day);
  const mood=String(entry.mood||'').trim();
  $('diaryMood').textContent=mood;
  $('diaryMetaDot').hidden=!mood;

  let paragraphs=Array.isArray(entry.paragraphs)?entry.paragraphs:[];
  if(!paragraphs.length&&entry.body)paragraphs=String(entry.body).split(/\n{2,}/);
  const text=$('diaryText');
  text.replaceChildren();
  for(const raw of paragraphs){
    if(raw==null)continue;
    const paragraph=String(raw).trim();
    if(!paragraph)continue;
    const node=document.createElement('p');
    node.innerHTML=escape(paragraph).replace(/&lt;del&gt;([\s\S]*?)&lt;\/del&gt;/g,"<del>$1</del>");
    text.append(node);
  }
  if(!text.childElementCount){
    const node=document.createElement('p');
    node.textContent='这一页只留下了一点空白。';
    text.append(node);
  }

  const edited=entry.edited===true||/<del>/.test(String(entry.body||''));
  const editedNote=diaryEdited;
  if(editedNote)editedNote.hidden=!edited;
  const line=String(entry.line||'').trim();
  const lineBox=$('diaryLine');
  lineBox.textContent=line;
  lineBox.hidden=!line;

  const at=$('diaryAt');
  const date=toDate(entry.at);
  if(date)at.dateTime=date.toISOString();else at.removeAttribute('datetime');
  at.textContent=fmtWhen(entry.at);
  const roleName=String(entry.role||'').trim();
  if(roleName)$('diaryRole').textContent=roleName;
}

async function request(path,options){
  const init={method:(options&&options.method)||'GET',headers:{'X-Jinbao-Setup':nonce}};
  if(options&&options.body!=null){
    init.headers['Content-Type']='application/json';
    init.body=options.body;
  }
  const response=await fetch(path,init);
  let data=null;
  try{data=await response.json()}catch(_){}
  return {response,data};
}

async function selectDay(day){
  const seq=++panelSeq;
  selected=day;
  renderList();
  if(count===0){showEmpty(true);return}
  if(!byDay.has(day)){showEmpty(false,day);return}
  setPanel('loading');
  try{
    const {response,data}=await request('/api/diary/'+encodeURIComponent(day));
    if(seq!==panelSeq)return;
    if(response.status===404){
      byDay.delete(day);
      setCount(count-1);
      renderList();
      showEmpty(count===0,day);
      return;
    }
    if(!response.ok)throw Error((data&&data.error)||'日记暂时读不出来');
    if(!data||!data.entry)throw Error('日记暂时读不出来');
    renderEntry(data.entry);
  }catch(error){
    if(seq!==panelSeq)return;
    showError();
  }
}

async function loadLastYear(day){
  const button=$('diaryLastYear');
  if(!button)return;
  try{
    const {response,data}=await request('/api/diary/on-this-day?day='+encodeURIComponent(day));
    const entry=data&&data.entry;
    if(!response.ok||!entry){button.hidden=true;return;}
    const sameYear=Number(String(entry.day).slice(0,4))===Number(String(day).slice(0,4))-1;
    button.dataset.day=entry.day;
    button.textContent=(sameYear?'去年今天：':'那年今天：')+String(entry.title||'那天');
    button.hidden=false;
  }catch(_){button.hidden=true;}
}

async function loadDiary(){
  const seq=++panelSeq;
  notice('');
  setPanel('loading');
  try{
    const {response,data}=await request('/api/diary');
    if(seq!==panelSeq)return;
    if(!response.ok)throw Error((data&&data.error)||'日记暂时读不出来');
    entries=Array.isArray(data&&data.entries)?data.entries.filter(row=>row&&typeof row.day==='string'):[];
    byDay=new Map(entries.map(row=>[row.day,row]));
    setCount(Number.isFinite(Number(data&&data.count))?Number(data.count):entries.length);
    ready=true;
    const enabled=!(data&&data.enabled===false);
    $('diaryToggle').checked=enabled;
    renderList();
    await loadLastYear(dayKeyOf(new Date()));
    if(count===0){
      selected=dayKeyOf(new Date());
      renderList();
      showEmpty(true);
      return;
    }
    const today=dayKeyOf(new Date());
    const visible=recentDays(DAYS);
    let target=selected&&byDay.has(selected)?selected:'';
    if(!target)target=byDay.has(today)?today:(visible.find(day=>byDay.has(day))||today);
    await selectDay(target);
  }catch(error){
    if(seq!==panelSeq)return;
    showError();
  }
}

$('diaryToggle').addEventListener('change',async event=>{
  const input=event.target;
  const next=input.checked;
  input.disabled=true;
  try{
    const {response,data}=await request('/api/diary/settings',{method:'POST',body:JSON.stringify({enabled:next})});
    if(!response.ok)throw Error((data&&data.error)||'开关没有保存成功');
    input.checked=data&&typeof data.enabled==='boolean'?data.enabled:next;
    notice(input.checked?'日记打开了。':'日记合上了，写过的页都还在。');
  }catch(error){
    input.checked=!next;
    notice('开关没有保存成功，等一会儿再试试。','error');
  }finally{
    input.disabled=false;
  }
});

$('diaryLastYear')?.addEventListener('click',async event=>{const day=event.currentTarget.dataset.day;if(day)await selectDay(day);});

$('diaryDelete').addEventListener('click',async()=>{
  if(!selected||count===0)return;
  if(!confirm('要撕掉这一页吗？撕掉之后就找不回来了。'))return;
  const button=$('diaryDelete');
  const day=selected;
  button.disabled=true;
  try{
    const {response,data}=await request('/api/diary/'+encodeURIComponent(day),{method:'DELETE'});
    if(!response.ok&&response.status!==404)throw Error((data&&data.error)||'没有撕掉');
    byDay.delete(day);
    setCount(count-1);
    renderList();
    showEmpty(count===0,day);
    notice('这一页已经撕掉了。');
  }catch(error){
    notice('没有撕掉，等一会儿再试试。','error');
  }finally{
    button.disabled=false;
  }
});

$('diaryRetry').addEventListener('click',()=>{loadDiary()});

renderList();
loadDiary();
})();
</script></body></html>
